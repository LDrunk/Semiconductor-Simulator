<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>异质结能带演变与特性精细仿真系统 - 完美断崖版</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #151f32;
            --border-color: #243552;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            overflow-y: auto; 
            min-height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            font-size: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .junction-badge {
            background-color: #0284c7;
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 16px;
            flex-wrap: wrap;
        }

        .side-panel {
            flex: 1;
            min-width: 300px;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .center-area {
            flex: 2;
            min-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 18px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-blue);
            border-left: 4px solid var(--accent-blue);
            padding-left: 8px;
            margin-bottom: 12px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .control-group label .val {
            color: var(--text-main);
            font-weight: bold;
        }

        select, input[type="range"] {
            width: 100%;
            background-color: #090d16;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-blue);
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn {
            background-color: #090d16;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .btn.active, .btn:hover {
            background-color: var(--accent-blue);
            color: #0b0f19;
            font-weight: bold;
        }

        .canvas-wrapper {
            position: relative;
            height: 440px; 
            background-color: #090d16;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .bottom-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stage-banner {
            background: rgba(9, 13, 22, 0.9);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 500;
        }

        .param-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 6px;
        }

        .param-table th, .param-table td {
            padding: 6px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .param-table th { color: #64748b; }

        .legend {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 11px;
            margin-top: 10px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .line-dot { width: 12px; height: 4px; }
        .circle-dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>

    <header>
        <h1>异质结能带演变与特性精细仿真系统</h1>
        <div id="junction-badge" class="junction-badge">正在识别结类型...</div>
    </header>

    <div class="main-layout">
        
        <div class="side-panel">
            <div class="card">
                <div class="card-title">左半导体 (Region 1)</div>
                <div class="control-group">
                    <label>材料选择</label>
                    <select id="mat1">
                        <option value="GaAs" selected>GaAs (砷化镓)</option>
                        <option value="Si">Si (硅)</option>
                        <option value="Ge">Ge (锗)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>导电类型</label>
                    <select id="type1">
                        <option value="p" selected>P 型</option>
                        <option value="n">N 型</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>掺杂浓度 N₁ <span class="val" id="lbl-na">1.0e16 cm⁻³</span></label>
                    <input type="range" id="range-na" min="14" max="18" step="0.2" value="16">
                </div>
            </div>

            <div class="card">
                <div class="card-title">右半导体 (Region 2)</div>
                <div class="control-group">
                    <label>材料选择</label>
                    <select id="mat2">
                        <option value="Si" selected>Si (硅)</option>
                        <option value="Ge">Ge (锗)</option>
                        <option value="GaAs">GaAs (砷化镓)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>导电类型</label>
                    <select id="type2">
                        <option value="n" selected>N 型</option>
                        <option value="p">P 型</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>掺杂浓度 N₂ <span class="val" id="lbl-nd">1.0e16 cm⁻³</span></label>
                    <input type="range" id="range-nd" min="14" max="18" step="0.2" value="16">
                </div>
            </div>
        </div>

        <div class="center-area">
            <div id="stage-banner" class="stage-banner">第一步: 真空能级对齐</div>
            <div class="canvas-wrapper">
                <canvas id="bandCanvas"></canvas>
            </div>

            <div class="bottom-charts">
                <div class="card">
                    <div class="card-title">空间电荷分布 ＆ 耗尽宽度</div>
                    <div style="height: 120px;"><canvas id="chargeCanvas"></canvas></div>
                </div>
                <div class="card">
                    <div class="card-title">I-V 伏安特性同步工作点</div>
                    <div style="height: 120px;"><canvas id="ivCanvas"></canvas></div>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="card">
                <div class="card-title">第一步 → 第三步 平滑过渡动画</div>
                <div class="control-group">
                    <label style="color:#60a5fa; font-weight:bold;">拖动查看费米能级对准过程：<span class="val" id="lbl-stage">0%</span></label>
                    <input type="range" id="range-stage" min="0" max="1" step="0.01" value="0" style="background:#1e293b; height:10px;">
                </div>
                <p style="font-size:11px; color:#94a3b8; line-height:1.4;">
                    提示：演变未达到 100% 前系统处于独立/接触中状态，外加电压锁定为 0。完全建立平衡后方可加压。
                </p>
            </div>

            <div class="card">
                <div class="card-title">环境与外加电压控制</div>
                <div class="control-group">
                    <label>工作温度 T <span class="val" id="lbl-temp">300 K</span></label>
                    <input type="range" id="range-temp" min="250" max="400" step="5" value="300">
                </div>
                <div class="control-group">
                    <label>外加电压 Vₐ (正偏 / 反偏) <span class="val" id="lbl-bias">0.00 V</span></label>
                    <input type="range" id="range-bias" min="-2" max="2" step="0.04" value="0">
                </div>
                <div class="control-group">
                    <label>微观粒子动画流速</label>
                    <div class="btn-group">
                        <div class="btn" id="sp-05">0.5x</div>
                        <div class="btn active" id="sp-10">1.0x</div>
                        <div class="btn" id="sp-20">2.0x</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">实时演算参数</div>
                <table class="param-table">
                    <tr><th>参数</th><th>左侧</th><th>右侧</th></tr>
                    <tr><td>禁带 E_g</td><td id="m-eg1">-</td><td id="m-eg2">-</td></tr>
                    <tr><td>亲和势 χ</td><td id="m-chi1">-</td><td id="m-chi2">-</td></tr>
                    <tr><td>接触势垒 V_D</td><td colspan="2" style="text-align:center;color:var(--accent-blue);" id="m-vd">-</td></tr>
                    <tr><td>耗尽总宽 W</td><td colspan="2" style="text-align:center;color:var(--accent-green);" id="m-w">-</td></tr>
                </table>

                <div class="legend">
                    <div class="legend-item"><div class="line-dot" style="background:#ef4444;"></div><span>导带 Ec</span></div>
                    <div class="legend-item"><div class="line-dot" style="background:#3b82f6;border-top:1px dashed #3b82f6;height:0;"></div><span>费米 Ef</span></div>
                    <div class="legend-item"><div class="line-dot" style="background:#10b981;"></div><span>价带 Ev</span></div>
                    <div class="legend-item"><div class="line-dot" style="background:#ffffff;border-top:1px dotted #fff;height:0;"></div><span>真空 E0</span></div>
                    <div class="legend-item"><div class="circle-dot" style="background:#60a5fa;"></div><span>电子 (e)</span></div>
                    <div class="legend-item"><div class="circle-dot" style="background:#f43f5e;"></div><span>空穴 (h)</span></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const mats = {
            'Si':   { eg: 1.12, chi: 4.05, nc: 2.8e19, nv: 1.0e19, eps: 11.7 },
            'Ge':   { eg: 0.66, chi: 3.65, nc: 1.04e19, nv: 6.0e18, eps: 16.0 }, 
            'GaAs': { eg: 1.42, chi: 4.45, nc: 4.7e17, nv: 7.0e18, eps: 13.1 }  
        };

        const q = 1.602e-19, k = 1.38e-23, eps0 = 8.854e-12;
        let state = {
            mat1: 'GaAs', type1: 'p', N1: 1e16,
            mat2: 'Si', type2: 'n', N2: 1e16,
            temp: 300, bias: 0.0, stage: 0.0, speed: 1.0
        };
        let particles = [];

        const cBand = document.getElementById('bandCanvas');
        const ctxBand = cBand.getContext('2d');
        const cCharge = document.getElementById('chargeCanvas');
        const ctxCharge = cCharge.getContext('2d');
        const cIv = document.getElementById('ivCanvas');
        const ctxIv = cIv.getContext('2d');

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            [cBand, cCharge, cIv].forEach(c => {
                const rect = c.parentElement.getBoundingClientRect();
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
            });
        }
        window.addEventListener('resize', resize);

        function initUI() {
            const listen = (id, prop, isFloat, cb) => {
                document.getElementById(id).addEventListener('input', e => {
                    state[prop] = isFloat ? parseFloat(e.target.value) : e.target.value;
                    if(cb) cb(e.target.value);
                });
            };

            listen('mat1', 'mat1', false, () => { updateBadge(); resetProcess(); });
            listen('mat2', 'mat2', false, () => { updateBadge(); resetProcess(); });
            listen('type1', 'type1', false, () => { updateBadge(); resetProcess(); });
            listen('type2', 'type2', false, () => { updateBadge(); resetProcess(); });

            listen('range-na', 'N1', true, v => {
                state.N1 = Math.pow(10, v);
                document.getElementById('lbl-na').innerText = state.N1.toExponential(1) + ' cm⁻³';
            });
            listen('range-nd', 'N2', true, v => {
                state.N2 = Math.pow(10, v);
                document.getElementById('lbl-nd').innerText = state.N2.toExponential(1) + ' cm⁻³';
            });
            listen('range-temp', 'temp', true, v => {
                document.getElementById('lbl-temp').innerText = v + ' K';
            });
            listen('range-stage', 'stage', true, v => {
                document.getElementById('lbl-stage').innerText = Math.round(v*100) + '%';
                if(v < 1.0) {
                    state.bias = 0;
                    document.getElementById('range-bias').value = 0;
                    document.getElementById('lbl-bias').innerText = '0.00 V';
                }
            });
            listen('range-bias', 'bias', true, v => {
                if(state.stage < 1.0) {
                    state.stage = 1.0;
                    document.getElementById('range-stage').value = 1.0;
                    document.getElementById('lbl-stage').innerText = '100%';
                }
                document.getElementById('lbl-bias').innerText = parseFloat(v).toFixed(2) + ' V';
            });

            const speeds = {'sp-05': 0.5, 'sp-10': 1.0, 'sp-20': 2.0};
            Object.keys(speeds).forEach(id => {
                document.getElementById(id).addEventListener('click', e => {
                    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    state.speed = speeds[id];
                });
            });
        }

        function resetProcess() {
            state.stage = 0; state.bias = 0;
            document.getElementById('range-stage').value = 0;
            document.getElementById('lbl-stage').innerText = '0%';
            document.getElementById('range-bias').value = 0;
            document.getElementById('lbl-bias').innerText = '0.00 V';
        }

        function updateBadge() {
            let b = document.getElementById('junction-badge');
            let t2 = state.type2 === 'p' ? 'P' : 'N';
            b.innerText = `当前形成：${state.type1}${t2} 结`;
        }

        function calcPhysics() {
            let p1 = mats[state.mat1];
            let p2 = mats[state.mat2];
            let Vt = (k * state.temp) / q;

            let vBuffer = 0.25;
            let ef1_vac = (state.type1 === 'n') 
                ? p1.chi + vBuffer + Vt*Math.log(p1.nc/state.N1)*0.3 
                : p1.chi + p1.eg - vBuffer - Vt*Math.log(p1.nv/state.N1)*0.3;
            let ef2_vac = (state.type2 === 'n') 
                ? p2.chi + vBuffer + Vt*Math.log(p2.nc/state.N2)*0.3 
                : p2.chi + p2.eg - vBuffer - Vt*Math.log(p2.nv/state.N2)*0.3;

            let Vd = ef1_vac - ef2_vac; 
            let V_total = Vd - state.bias;
            let V_total_abs = Math.abs(V_total);

            let eps1 = p1.eps * eps0, eps2 = p2.eps * eps0;
            let n1_m = state.N1 * 1e6, n2_m = state.N2 * 1e6;
            
            let V1 = V_total_abs * (eps2 * n2_m) / (eps1 * n1_m + eps2 * n2_m);
            let V2 = V_total_abs * (eps1 * n1_m) / (eps1 * n1_m + eps2 * n2_m);

            let x1 = Math.sqrt((2 * eps1 * V1) / (q * n1_m)) * 1e9;
            let x2 = Math.sqrt((2 * eps2 * V2) / (q * n2_m)) * 1e9;
            let W = x1 + x2;

            document.getElementById('m-eg1').innerText = p1.eg.toFixed(2) + ' eV';
            document.getElementById('m-eg2').innerText = p2.eg.toFixed(2) + ' eV';
            document.getElementById('m-chi1').innerText = p1.chi.toFixed(2) + ' eV';
            document.getElementById('m-chi2').innerText = p2.chi.toFixed(2) + ' eV';
            document.getElementById('m-vd').innerText = Math.abs(Vd).toFixed(3) + ' V';
            document.getElementById('m-w').innerText = (W * state.stage).toFixed(1) + ' nm';

            return { ef1_vac, ef2_vac, Vd, V1, V2, x1, x2, W };
        }

        function initParticles() {
            particles = [];
            for(let i=0; i<140; i++) {
                let left = Math.random() < 0.5;
                particles.push({
                    left: left,
                    type: left ? (state.type1 === 'p'?'h':'e') : (state.type2 === 'p'?'h':'e'),
                    x_rel: Math.random(),
                    y_fuzz: Math.random() * 20 - 10,
                    vx: (Math.random() * 0.008 + 0.004)
                });
            }
        }

        function drawBand(p) {
            const dpr = window.devicePixelRatio || 1;
            ctxBand.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxBand.clearRect(0, 0, cBand.width/dpr, cBand.height/dpr);

            const w = cBand.width / dpr;
            const h = cBand.height / dpr;
            const midX = w / 2;

            let banner = document.getElementById('stage-banner');
            if(state.stage === 0) {
                banner.innerText = "第一步: 独立状态（左右侧真空能级对齐呈一条水平直线）";
                banner.style.borderColor = "#94a3b8";
            } else if(state.stage < 1) {
                banner.innerText = "第二步: 平滑接触过渡（费米能级向中间靠拢对齐，真空能级保持平滑连续弯曲）";
                banner.style.borderColor = "#f59e0b";
            } else {
                if(state.bias > 0.05) banner.innerText = "动态仿真 [正向偏置]: 势垒降低，费米能级发生非平衡拆分，多子跨越结区大量扩散";
                else if(state.bias < -0.05) banner.innerText = "动态仿真 [反向偏置]: 势垒区加宽，阻挡扩散，仅存在极微少少子漂移";
                else banner.innerText = "第三步: 热平衡建立（费米能级100%对齐呈完美直线，带边形成平滑弯曲与完美的不连续断崖）";
                banner.style.borderColor = "#34d399";
            }

            const evScale = 115;          
            const vacCompress = 3.3;     

            let p1 = mats[state.mat1];
            let p2 = mats[state.mat2];

            let midY_left = p1.chi + p1.eg / 2;
            let midY_right = state.stage * (p.Vd - state.bias) + p2.chi + p2.eg / 2;
            let globalMidEV = (midY_left + midY_right) / 2;

            const zeroVacY = (h * 0.53) - (globalMidEV - vacCompress) * evScale;

            let dw1 = 0, dw2 = 0;
            let W_nm = p.x1 + p.x2;
            if(W_nm > 0) {
                let total_visual_w = 140; 
                dw1 = total_visual_w * (p.x1 / W_nm) * state.stage;
                dw2 = total_visual_w * (p.x2 / W_nm) * state.stage;
            }

            let ly_vac = zeroVacY;
            let ly_ef  = zeroVacY + (p.ef1_vac - vacCompress) * evScale;

            let ry_vac = zeroVacY + (p.Vd - state.bias) * evScale * state.stage;
            let ry_ef  = ry_vac + (p.ef2_vac - vacCompress) * evScale;

            let sign = Math.sign(p.Vd - state.bias);

            function getE0(x) {
                if(x < midX) {
                    if(x < midX - dw1) return ly_vac;
                    let t = (x - (midX - dw1)) / (dw1 || 1); 
                    return ly_vac + sign * p.V1 * evScale * state.stage * t * t;
                } else {
                    if(x > midX + dw2) return ry_vac;
                    let t = ((midX + dw2) - x) / (dw2 || 1); 
                    return ry_vac - sign * p.V2 * evScale * state.stage * t * t;
                }
            }

            // 1. 绘制真空能级
            ctxBand.lineWidth = 2.5;
            ctxBand.strokeStyle = '#ffffff';
            ctxBand.beginPath();
            for(let x=0; x<w; x+=2) {
                let y = getE0(x);
                if(x===0) ctxBand.moveTo(x, y); else ctxBand.lineTo(x, y);
            }
            ctxBand.stroke();

            // 2. 绘制费米能级
            ctxBand.lineWidth = 1.5;
            ctxBand.strokeStyle = '#3b82f6';
            ctxBand.setLineDash([5, 3]);
            ctxBand.beginPath(); ctxBand.moveTo(0, ly_ef); ctxBand.lineTo(midX, ly_ef); ctxBand.stroke();
            ctxBand.beginPath(); ctxBand.moveTo(midX, ry_ef); ctxBand.lineTo(w, ry_ef); ctxBand.stroke();
            ctxBand.setLineDash([]);

            // 3. 绘制导带和价带曲线（取消强制连接，保留真实的断崖式不连续）
            ctxBand.lineWidth = 3.5;
            
            // 左侧弯曲
            ctxBand.strokeStyle = '#ef4444'; ctxBand.beginPath();
            for(let x=0; x<=midX; x+=2) { let y = getE0(x) + (p1.chi - vacCompress) * evScale; if(x===0) ctxBand.moveTo(x, y); else ctxBand.lineTo(x, y); }
            ctxBand.stroke();

            ctxBand.strokeStyle = '#10b981'; ctxBand.beginPath();
            for(let x=0; x<=midX; x+=2) { let y = getE0(x) + (p1.chi + p1.eg - vacCompress) * evScale; if(x===0) ctxBand.moveTo(x, y); else ctxBand.lineTo(x, y); }
            ctxBand.stroke();

            // 右侧弯曲
            ctxBand.strokeStyle = '#ef4444'; ctxBand.beginPath();
            for(let x=midX; x<w; x+=2) { let y = getE0(x) + (p2.chi - vacCompress) * evScale; if(x===midX) ctxBand.moveTo(x, y); else ctxBand.lineTo(x, y); }
            ctxBand.stroke();

            ctxBand.strokeStyle = '#10b981'; ctxBand.beginPath();
            for(let x=midX; x<w; x+=2) { let y = getE0(x) + (p2.chi + p2.eg - vacCompress) * evScale; if(x===midX) ctxBand.moveTo(x, y); else ctxBand.lineTo(x, y); }
            ctxBand.stroke();

            // 4. 边界辅助虚线（严格使用虚线，避免产生“上下连通”的错觉）
            if(state.stage > 0.05) {
                ctxBand.lineWidth = 1;
                ctxBand.strokeStyle = 'rgba(255,255,255,0.12)';
                ctxBand.setLineDash([3, 3]);
                ctxBand.beginPath(); ctxBand.moveTo(midX-dw1, 0); ctxBand.lineTo(midX-dw1, h); ctxBand.stroke();
                ctxBand.beginPath(); ctxBand.moveTo(midX+dw2, 0); ctxBand.lineTo(midX+dw2, h); ctxBand.stroke();
                
                // 异质结界面线调整为明显的细虚点线
                ctxBand.strokeStyle = 'rgba(255,255,255,0.2)';
                ctxBand.setLineDash([6, 6]);
                ctxBand.beginPath(); ctxBand.moveTo(midX, 0); ctxBand.lineTo(midX, h); ctxBand.stroke();
                ctxBand.setLineDash([]);
            }

            // 5. 粒子渲染
            particles.forEach(pt => {
                let drive = 0;
                if(state.stage >= 0.98) {
                    drive = state.bias * 0.35; 
                    if(state.bias < 0) drive = state.bias * 0.02; 
                }

                if(pt.type === 'e') pt.x_rel += (pt.vx + drive * 0.006) * state.speed;
                else pt.x_rel -= (pt.vx + drive * 0.006) * state.speed;

                if(pt.x_rel > 1) pt.x_rel = 0;
                if(pt.x_rel < 0) pt.x_rel = 1;

                let px = pt.left ? pt.x_rel * midX : midX + pt.x_rel * (w - midX);
                if(px < 2) px = 2; if(px > w-2) px = w-2;

                let vac_y = getE0(px);
                let py = 0;

                if(pt.left) {
                    py = (pt.type === 'e') ? vac_y + (p1.chi - vacCompress) * evScale - 7 + pt.y_fuzz * 0.2 : vac_y + (p1.chi + p1.eg - vacCompress) * evScale + 9 + pt.y_fuzz * 0.2;
                } else {
                    py = (pt.type === 'e') ? vac_y + (p2.chi - vacCompress) * evScale - 7 + pt.y_fuzz * 0.2 : vac_y + (p2.chi + p2.eg - vacCompress) * evScale + 9 + pt.y_fuzz * 0.2;
                }

                ctxBand.fillStyle = (pt.type === 'e') ? '#60a5fa' : '#f43f5e';
                ctxBand.shadowBlur = 4;
                ctxBand.shadowColor = ctxBand.fillStyle;
                ctxBand.beginPath(); ctxBand.arc(px, py, 3.5, 0, Math.PI*2); ctxBand.fill();
                ctxBand.shadowBlur = 0;
            });

            ctxBand.fillStyle = '#ffffff'; ctxBand.fillText("真空能级 E₀", 10, ly_vac - 6);
            ctxBand.fillStyle = '#ef4444'; ctxBand.fillText("导带 E_c", 10, ly_vac + (p1.chi - vacCompress)*evScale - 6);
            ctxBand.fillStyle = '#3b82f6'; ctxBand.fillText("费米能级 E_f", 10, ly_ef - 6);
            ctxBand.fillStyle = '#10b981'; ctxBand.fillText("价带 E_v", 10, ly_vac + (p1.chi+p1.eg - vacCompress)*evScale + 14);
        }

        function drawCharge(p) {
            const dpr = window.devicePixelRatio || 1;
            ctxCharge.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxCharge.clearRect(0, 0, cCharge.width/dpr, cCharge.height/dpr);

            const w = cCharge.width / dpr;
            const h = cCharge.height / dpr;
            const midX = w / 2;
            const zeroY = h / 2;

            ctxCharge.strokeStyle = '#243552';
            ctxCharge.beginPath(); ctxCharge.moveTo(0, zeroY); ctxCharge.lineTo(w, zeroY); ctxCharge.stroke();
            ctxCharge.beginPath(); ctxCharge.moveTo(midX, 0); ctxCharge.lineTo(midX, h); ctxCharge.stroke();

            if(state.stage < 0.05) return;

            let dw1 = 0, dw2 = 0;
            let W_nm = p.x1 + p.x2;
            if(W_nm > 0) {
                let total_visual_w = 140;
                dw1 = total_visual_w * (p.x1 / W_nm) * state.stage;
                dw2 = total_visual_w * (p.x2 / W_nm) * state.stage;
            }

            let sign = (p.Vd > 0) ? 1 : -1;
            if(state.type1 === 'p' && state.type2 === 'n') sign = -1;
            if(state.type1 === 'n' && state.type2 === 'p') sign = 1;

            ctxCharge.fillStyle = sign > 0 ? 'rgba(52,211,153,0.4)' : 'rgba(248,113,113,0.4)';
            ctxCharge.fillRect(midX - dw1, zeroY, dw1, sign * 20);

            ctxCharge.fillStyle = sign > 0 ? 'rgba(248,113,113,0.4)' : 'rgba(52,211,153,0.4)';
            ctxCharge.fillRect(midX, zeroY, dw2, -sign * 20);
        }

        function drawIv(p) {
            const dpr = window.devicePixelRatio || 1;
            ctxIv.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxIv.clearRect(0, 0, cIv.width/dpr, cIv.height/dpr);

            const w = cIv.width / dpr;
            const h = cIv.height / dpr;
            const originX = w * 0.35;
            const originY = h * 0.75;

            ctxIv.strokeStyle = '#243552';
            ctxIv.beginPath(); ctxIv.moveTo(0, originY); ctxIv.lineTo(w, originY); ctxIv.stroke();
            ctxIv.beginPath(); ctxIv.moveTo(originX, 0); ctxIv.lineTo(originX, h); ctxIv.stroke();

            ctxIv.strokeStyle = '#38bdf8';
            ctxIv.lineWidth = 2;
            ctxIv.beginPath();

            let pts = [];
            for(let v=-2.0; v<=2.0; v+=0.05) {
                let current = 0;
                let factor = Math.exp(-Math.abs(p.Vd)/0.04);
                if(v > 0) {
                    current = 0.08 * factor * (Math.exp(v/0.22) - 1);
                } else {
                    current = 0.01 * (Math.exp(v*3) - 1);
                }
                let ptX = originX + v * (w * 0.28);
                let ptY = originY - current * 16;
                pts.push({x: ptX, y: ptY});
            }

            pts.forEach((pt, idx) => {
                if(pt.y >= 2 && pt.y <= h-2) {
                    if(idx === 0) ctxIv.moveTo(pt.x, pt.y); else ctxIv.lineTo(pt.x, pt.y);
                }
            });
            ctxIv.stroke();

            if(state.stage > 0.9) {
                let v = state.bias;
                let current = v > 0 ? 0.08 * Math.exp(-Math.abs(p.Vd)/0.04) * (Math.exp(v/0.22) - 1) : 0.01 * (Math.exp(v*3) - 1);
                let dotX = originX + v * (w * 0.28);
                let dotY = originY - current * 16;

                ctxIv.fillStyle = '#f43f5e';
                ctxIv.shadowBlur = 6;
                ctxIv.shadowColor = '#f43f5e';
                ctxIv.beginPath(); ctxIv.arc(dotX, dotY, 5, 0, Math.PI*2); ctxIv.fill();
                ctxIv.shadowBlur = 0;
            }
        }

        function loop() {
            let p = calcPhysics();
            drawBand(p);
            drawCharge(p);
            drawIv(p);
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            initUI();
            updateBadge();
            resize();
            initParticles();
            loop();
        };
    </script>
</body>
</html>
